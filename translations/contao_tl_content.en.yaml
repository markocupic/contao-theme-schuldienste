tl_content:
    # Legends
    anchorLink_legend: Sprungmarke (Anchor Link)
    # Fields
    marginTop:
        - Aussenabstand oben (margin-top)
        - Fügen Sie einen Aussenabstand oberhalb des Inhaltselementes ein.
    marginBottom:
        - Aussenabstand unten (margin-bottom)
        - Fügen Sie einen Aussenabstand unterhalb des Inhaltselementes ein.
    anchorLink:
        - Sprungmarke (Sprunkmarkentext)
        - Erstelle eine Sprungmarke für dieses Element. Schreibe den Link-Text in dieses Feld.
    anchorLinkContext:
        - Such-Kontext
        - Layout Element (CSS ID) in dem nach Sprungmarken gesucht werden soll.
    addTextGallery:
        - Add image gallery
         Add an image gallery to the element.

    # References
    mt-none:
